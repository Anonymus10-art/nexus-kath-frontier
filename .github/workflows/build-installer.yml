name: Compilar instalador

on:
  workflow_dispatch:
  push:
    tags:
      - "launcher-v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependencias
        run: dotnet restore NexusKathFrontier.sln

      - name: Publicar launcher
        run: dotnet publish src/NexusKathFrontier.Launcher/NexusKathFrontier.Launcher.csproj -c Release -r win-x64 --self-contained true -o artifacts/launcher

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Crear instalador
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss'
        shell: powershell

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-KATH-FRONTIER-Installer
          path: artifacts/installer/*.exe
          if-no-files-found: error
